# docker-compose.yml
#
#
# Postgres and Keycloak are NOT defined here — I  already run
# those yourself (Postgres locally, Keycloak in its own container).
# Both services below reach them through "host.docker.internal",
# which the extra_hosts entry maps to the Docker host's own
# network — this is what lets a container talk to something
# listening on your machine's localhost.

services:
  backend:
    build:
      context: ./images
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/workflow_db
      SPRING_DATASOURCE_USERNAME: workflow_user
      SPRING_DATASOURCE_PASSWORD: workflow123
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://host.docker.internal:8080/realms/WorkflowApp
      KEYCLOAK_TOKEN-URL: http://host.docker.internal:8080/realms/WorkflowApp/protocol/openid-connect/token
      FILE_STORAGE_LOCATION: /app/uploads/images
    volumes:
      - uploaded-images:/app/uploads

  frontend:
    build:
      context: ./image-master
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  uploaded-images: