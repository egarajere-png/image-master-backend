spring:

  datasource:
    driver-class-name: org.postgresql.Driver

    url: jdbc:postgresql://localhost:5432/workflow_db

    username: workflow_user

    password: workflow123

    hikari:
      pool-name: WorkflowPool
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: true

    locations:
      - classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/WorkflowApp


springdoc:

  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha

  api-docs:
    path: /v3/api-docs


logging:

  level:
    root: INFO

    com.abcbank.workflow: DEBUG

    com.abcbank.images: DEBUG

    org.springframework.security: DEBUG

    org.hibernate.SQL: DEBUG


keycloak:

  token-url: http://localhost:8080/realms/WorkflowApp/protocol/openid-connect/token

  client-id: workflow-api

file:
  storage:
    location: uploads/images